<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirection...</title>
    <script>
      // GitHub Pages SPA fallback: redirect unknown paths to index.html while preserving route + query.
      (function () {
        var location = window.location;
        var path = location.pathname;
        var search = location.search ? '&' + location.search.slice(1).replace(/&/g, '~and~') : '';
        var target =
          location.protocol +
          '//' +
          location.hostname +
          (location.port ? ':' + location.port : '') +
          '/?/' +
          path.slice(1).replace(/&/g, '~and~') +
          search +
          location.hash;

        location.replace(target);
      })();
    </script>
  </head>
  <body>
    <noscript>
      <h1>Page introuvable</h1>
      <p>Activez JavaScript pour etre redirige vers l'application.</p>
    </noscript>
  </body>
</html>
