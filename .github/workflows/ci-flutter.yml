name: CI - Flutter

on:
  push:
    branches: [main]
    paths:
      - 'flutter_application/**'
      - '.github/workflows/ci-flutter.yml'
  pull_request:
    paths:
      - 'flutter_application/**'
      - '.github/workflows/ci-flutter.yml'

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: flutter_application
        run: flutter pub get

      - name: Analyze
        working-directory: flutter_application
        run: flutter analyze

      - name: Test
        working-directory: flutter_application
        run: flutter test
