name: Nouvelle fonctionnalité
labels:
  - enhancement
title: "[Feature] "
description: Décrire une nouvelle fonctionnalité, son objectif et les critères d'acceptation.
body:
  - type: markdown
    attributes:
      value: |
        Merci de décrire la fonctionnalité souhaitée de façon concrète. Les informations ci-dessous nous aideront à évaluer le besoin, le périmètre et l'effort.
  - type: textarea
    id: problem
    attributes:
      label: Problème ou besoin
      description: Quel besoin utilisateur ou métier cette fonctionnalité doit-elle couvrir ?
      placeholder: Décrivez le contexte et le besoin actuel.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Fonctionnalité proposée
      description: Décrivez la solution attendue et le comportement souhaité.
      placeholder: Décrivez la fonctionnalité, les écrans ou les API concernées.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critères d'acceptation
      description: Listez les critères qui permettront de considérer la fonctionnalité comme terminée.
      placeholder: |
        - [ ] Critère 1
        - [ ] Critère 2
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact sur le périmètre
      description: Indiquez les modules, écrans, services ou domaines impactés.
      placeholder: Frontend, backend, gateway, documentation, tests...
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Si la fonctionnalité concerne l'application Flutter, consultez aussi les plateformes supportées :
        [Supported deployment platforms](https://docs.flutter.dev/reference/supported-platforms)
  - type: dropdown
    id: flutter_target
    attributes:
      label: Ajouter cette fonctionnalité à l'application Flutter ?
      description: Indiquez si la fonctionnalité doit aussi être livrée dans l'application Flutter.
      options:
        - Non
        - Oui
    validations:
      required: true
  - type: checkboxes
    id: flutter_platforms
    attributes:
      label: Si oui, plateformes Flutter à cibler
      description: Cochez une ou plusieurs plateformes de sortie.
      options:
        - label: Android
        - label: iOS (iPhone)
        - label: Windows
        - label: macOS
        - label: Linux
        - label: Web
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives envisagées
      description: Si vous avez envisagé d'autres approches, indiquez-les ici.
      placeholder: Décrivez les alternatives ou pourquoi elles ont été écartées.
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: Références
      description: Ajoutez tout lien utile, capture d'écran, maquette ou exemple.
      placeholder: Liens, captures, tickets liés, documentation...
    validations:
      required: false
