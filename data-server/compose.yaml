services:
  grafana-lgtm:
    image: 'grafana/otel-lgtm:latest'
    ports:
      - '3000:3000'
      - '4317'
      - '4318'
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432'
  server:
    build: .
    ports:
      - '8080:8080'
    environment:
      - 'DATABASE_URL=postgresql://myuser:secret@postgres:5432/mydatabase'
      - 'OTEL_EXPORTER_OTLP_ENDPOINT=http://grafana-lgtm:4317'